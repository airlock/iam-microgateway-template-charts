{{- if not .Values.global.microgatewaySidecarMode }}
apiVersion: microgateway.airlock.com/v1alpha1
kind: GatewayParameters
metadata:
  name: "{{ .Values.gatewayApi.engine.name }}-parameters"
spec:
  features:
    envoyExtensionPolicyEnabled: true
    insecureTLSAllowed: {{ .Values.gatewayApi.gatewayParameters.insecureTLSAllowed }}
  logging:
    level: {{ .Values.gatewayApi.gatewayParameters.logLevel }}
  kubernetes:
    service:
      type: {{ .Values.gatewayApi.gatewayParameters.serviceType }}
    deployment:
      replicas: {{ .Values.gatewayApi.gatewayParameters.engineReplicas }}
      engineContainer:
        resources:
{{ toYaml .Values.gatewayApi.gatewayParameters.engineResources | indent 10 }}
  defaults:
    telemetryRef:
      name: iam-telemetry
{{- end }}
