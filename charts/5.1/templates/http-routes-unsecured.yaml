{{- if not .Values.global.microgatewaySidecarMode }}
{{- range .Values.gatewayApi.unsecuredPaths }}
{{- $matchType := .type | default "PathPrefix" }}
{{- if not (has $matchType (list "Exact" "PathPrefix" "RegularExpression")) }}
{{- fail (printf "gatewayApi.unsecuredPaths entry %q has type %q; expected Exact, PathPrefix or RegularExpression." .name $matchType) }}
{{- end }}
{{- if and (eq $matchType "RegularExpression") (not (semverCompare ">=5.1" $.Values.global.microgatewayVersion)) }}
{{- fail (printf "gatewayApi.unsecuredPaths entry %q uses type RegularExpression, which Airlock Microgateway supports from 5.1 onwards (global.microgatewayVersion is %q)." .name $.Values.global.microgatewayVersion) }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
spec:
  parentRefs:
  - name: {{ quote $.Values.gatewayApi.engine.name }}
    kind: Gateway
    group: gateway.networking.k8s.io
    sectionName: https
  rules:
  - matches:
    - path:
        type: {{ $matchType }}
        value: {{ .path }}
    backendRefs:
    - name: {{ $.Values.gatewayApi.targetService.name }}
      kind: Service
      group: ""
      port: {{ $.Values.gatewayApi.targetService.port }}
...
{{- end }}
{{- end }}
